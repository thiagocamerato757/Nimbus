# DS-004: hand-authored test fixture, not an official Deadlock tournament format.
id: synthetic-deadlock
name: Synthetic Deadlock-style
format_version: 1
team_size: 6
character_label: Hero
character_pool_label: Hero Pool
catalog_file: synthetic-deadlock.catalog.yaml
sides: [amber, sapphire]
sides_coupled: false
default_draft_order: synthetic-six-player
draft_orders:
  - id: synthetic-six-player
    name: Six bans then twelve picks
    turns:
      # A, BB, AA, B: each grouped ban is its own sequential turn.
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: ban}
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
rule_settings:
  banning_locked: reject
  same_character_twice: reject
  voided_games_count: false
