id: league-of-legends
name: League of Legends
format_version: 1
team_size: 5
character_label: Champion
character_pool_label: Champion Pool
catalog_file: league-of-legends.catalog.yaml
sides: [blue, red]
sides_coupled: false
default_first_selection_holder: none
default_draft_order: lol-pro-2026
draft_orders:
  - id: lol-pro-2026
    name: Professional draft
    turns:
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
      - {position: second, kind: ban}
      - {position: first, kind: ban}
      - {position: second, kind: ban}
      - {position: first, kind: ban}
      - {position: second, kind: pick}
      - {position: first, kind: pick}
      - {position: first, kind: pick}
      - {position: second, kind: pick}
rule_settings:
  banning_locked: reject
  same_character_twice: reject
  voided_games_count: false

series_formats:
  - {kind: best_of, games: 1}
  - {kind: best_of, games: 3}
  - {kind: best_of, games: 5}
  - {kind: fixed_length, games: 4}
default_series_format: {kind: best_of, games: 5}
fearless_presets:
  - {id: "off", lock_reach: none, lock_sources: picks}
  - {id: soft, lock_reach: picking_team, lock_sources: picks}
  - {id: hard, lock_reach: both_teams, lock_sources: picks}
default_fearless: hard
